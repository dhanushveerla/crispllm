# ==============================================================================
# CrispLLM Configuration Example (crispllm.example.toml)
#
# CrispLLM is a lightweight, unified memory & context proxy for AI coding.
# Copy this file to crispllm.toml (in project root or ~/.config/crispllm/crispllm.toml)
# and adjust parameters as needed.
# ==============================================================================

[server]
# Host interface and port for the CrispLLM proxy server.
# Serves both OpenAI-compatible API at /v1/chat/completions and MCP at /mcp.
host = "127.0.0.1"
port = 8080

[upstream]
# Primary local LLM endpoint (default: Ollama OpenAI-compatible endpoint).
base_url = "http://127.0.0.1:11434/v1"

# Primary local model identifier.
model = "qwen2.5-coder:7b"

# Optional environment variable name holding API key (empty for local Ollama).
api_key_env = ""

[upstream.extra_body]
# Additional parameters merged into requests forwarded to the upstream model.
# e.g., reasoning_effort = "none"

[memory]
# Enable SQLite-backed tiered persistent memory and turn compaction.
enabled = true

# Maximum number of tokens dedicated to injected architectural facts / constraints.
max_injected_tokens = 384

# Automatically inject relevant constraints and pinned architectural facts into prompts.
inject_constraints = true

# Automatically extract key constants, signatures, and constraints from conversation turns.
auto_extract = true

# Enable compaction of middle turns in long conversations to stay within small context windows.
compact_middle_turns = true

# Token threshold above which turn compaction triggers (set to 0 to always compact middle turns).
compact_threshold_tokens = 2000

# Minimum token count for an individual turn to be considered for middle-turn compaction.
compact_min_turn_tokens = 150

# Number of most recent conversation turns to always preserve verbatim.
keep_recent_turns = 2

# Half-life in days for exponential memory relevance decay.
decay_half_life_days = 14.0

# Relevance score threshold below which decayed episodic memories are demoted to archival.
archive_threshold = 0.25

# Access count threshold to promote frequently recalled episodic memories to core tier.
promote_access_threshold = 5

# Enable background consolidation worker (deduplication, supersession, tier promotions/demotions).
consolidation_enabled = true

# Idle seconds before background consolidation triggers.
consolidation_idle_s = 30.0

# Number of proxy turns before triggering an immediate background consolidation sweep.
consolidation_every_n_turns = 8

# Enable optional async LLM synthesis for episodic episodes into architectural facts.
llm_synthesis = false

# Enable prefix-cache-stable prompt assembly. Merges system messages and places
# byte-stable Core facts in messages[0] while attaching turn-specific Episodic facts
# to the latest user message, maximizing KV-cache prefix hits in local runtimes.
prefix_stable_assembly = true

# Path to SQLite database file. If omitted, defaults to ~/.local/share/crispllm/memory.db
# db_path = "memory.db"

[cloud]
# Enable optional cloud escalation and fallback provider.
enabled = true

# Base URL for cloud API (e.g., NVIDIA NIM, DeepSeek, or OpenAI).
base_url = "https://integrate.api.nvidia.com/v1"

# Environment variable name holding the cloud provider API key.
api_key_env = "NVIDIA_API_KEY"

# Cloud model identifier used for escalated or fallback requests.
model = "nvidia/nemotron-3.5-bolt-e4b"

# HTTP timeout in seconds for cloud requests.
timeout_s = 60.0

[routing]
# Routing strategy:
#   "local_first" - Route to local upstream first; escalate to cloud when prompt exceeds
#                   threshold or if local upstream fails.
#   "local_only"  - Never route to cloud provider.
#   "cloud_only"  - Always route to cloud provider.
strategy = "local_first"

# Prompt token threshold to trigger proactive escalation to the cloud model.
escalate_token_threshold = 6000

# Fall back to cloud upstream if local model returns connection error, 5xx, 429, or 404.
escalate_on_local_error = true

# Timeout in seconds before considering a local request timed out.
local_timeout_s = 30.0

# Enable zero-LLM heuristic task-tier expert routing (fast / balanced / deep).
task_routing_enabled = false

# Optional faster local model identifier for 'fast' tier requests.
# fast_model = "qwen2.5-coder:1.5b"

# Maximum prompt token estimate for candidate 'fast' tier tasks.
fast_max_tokens = 1200

# Proactively escalate complex 'deep' tier tasks to cloud when cloud is enabled.
escalate_deep_tasks = true

[privacy]
# Enable zero-dependency secret and PII redaction.
enabled = true

# Only redact when requests are routed to external/cloud endpoints (preserves local plaintext).
redact_on_cloud_only = true

# Redact detected API keys, bearer tokens, private keys, and high-entropy secrets.
redact_secrets = true

# Redact email addresses.
redact_emails = true

# Redact IPv4 / IPv6 addresses.
redact_ips = false

# Additional regex patterns to redact (empty list by default).
extra_patterns = []

[security]
# Bearer authentication token for remote clients (Claude Web, ChatGPT Web, Manus, etc.).
# When set, all /mcp and /v1 requests require an "Authorization: Bearer <token>" header.
# auth_token_env specifies the environment variable name to read the token from.
auth_token_env = ""

# Literal fallback token if auth_token_env is not set or empty.
auth_token = ""

# Allow remote tunnel traffic to access paid /v1 chat completions.
# When false (recommended default for HTTPS tunnels), requests carrying proxy headers
# (x-forwarded-for, cf-connecting-ip, forwarded, x-real-ip) targeting /v1 are blocked
# with HTTP 403 Forbidden to prevent accidental cloud spend over public tunnels.
allow_remote_v1 = false

# Restrict MCP filesystem access (repo_map and file_outline) to specific directory roots.
# Paths outside these roots (including symlink escapes and .. traversal) are rejected.
# Leave empty to allow unrestricted local path access.
# allowed_repo_roots = ["/home/user/projects"]
allowed_repo_roots = []

[resources]
# Enable active RAM/VRAM watchdog, dynamic context budgeting, and idle model unloading.
enabled = true

# Local LLM backend type: "auto", "ollama", "llama_server", "openai"
local_backend = "auto"

# Dynamically adjust num_ctx on local Ollama requests according to prompt size and RAM pressure.
dynamic_num_ctx = true

# Discrete context buckets to minimize KV-cache reallocation overhead.
ctx_buckets = [2048, 4096, 8192]

# Maximum context allowed on local model under normal RAM conditions.
max_local_ctx = 8192

# Maximum context allowed under soft RAM pressure.
soft_max_ctx = 2048

# Hard floor minimum context allowed under hard RAM pressure before cloud escalation.
hard_min_ctx = 2048

# Assumed headroom for generated completion tokens when computing context requirements.
default_output_tokens = 512

# Available system RAM threshold (in MB) below which soft pressure is triggered.
soft_free_mb = 1024.0

# Available system RAM threshold (in MB) below which hard pressure is triggered.
hard_free_mb = 512.0

# Hysteresis buffer in MB to prevent pressure state flapping around thresholds.
hysteresis_mb = 64.0

# Polling interval in seconds for sampling system memory info.
watchdog_poll_s = 2.0

# Optional smaller model to downshift to under soft or local-only hard pressure.
# downshift_model = "qwen2.5-coder:1.5b"

# Automatically unload local model from memory after a period of inactivity.
idle_unload_enabled = true

# Inactivity duration in seconds before triggering local model unload (keep_alive: 0).
idle_unload_s = 300.0

# Inject cache_prompt=true for llama_server backends to persist prefix KV state.
llama_cache_prompt = true

[speculative]
# Enable automatic Cloud Predicted Outputs injection on OpenAI-compatible cloud providers.
# When true, requests containing an edit intent and code block are enriched with "prediction".
predicted_outputs_enabled = false

# Minimum length in characters of code block candidate before injecting prediction.
min_prediction_chars = 120

# Maximum length in characters of code block candidate. Larger blocks are skipped.
max_prediction_chars = 24000

# Minimum number of lines in code block candidate.
min_prediction_lines = 4

# Duration in seconds to cache unsupported cloud providers when HTTP 400 or 422 is returned.
unsupported_provider_ttl_s = 1800.0

# Local llama-server speculative preset: "ngram-simple", "ngram-mod", "draft", "hybrid"
local_mode = "ngram-simple"

# N-gram size for llama-server --spec-ngram-simple-size-n.
ngram_simple_size_n = 12

# N-gram match size for llama-server --spec-ngram-simple-size-m.
ngram_simple_size_m = 32

# Minimum hits required for llama-server --spec-ngram-simple-min-hits.
ngram_simple_min_hits = 1

# Window match size for llama-server --spec-ngram-mod-n-match.
ngram_mod_n_match = 16

# Minimum matches for llama-server --spec-ngram-mod-n-min.
ngram_mod_n_min = 8

# Maximum matches for llama-server --spec-ngram-mod-n-max.
ngram_mod_n_max = 32

# Path to draft GGUF model for "draft" or "hybrid" speculative presets.
# draft_model_path = "/models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"

# Maximum speculative tokens to draft per step (--spec-draft-n-max).
draft_n_max = 4

# Minimum probability threshold for accepting draft tokens (--spec-draft-p-min).
draft_p_min = 0.75

# Number of layers of draft model to offload to GPU (-ngld).
draft_gpu_layers = 99
