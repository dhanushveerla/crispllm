[project]
name = "edgemem"
version = "1.0.0"
description = "Lightweight unified memory & context proxy for AI coding on weak hardware"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "jarvis", email = "jarvis@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.165.0",
    "grep-ast>=0.9.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "networkx>=3.6.1",
    "platformdirs>=4.14.7",
    "psutil>=7.2.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.3",
    "tiktoken>=0.14.0",
    "tomli-w>=1.2.0",
    "tree-sitter-language-pack>=1.25.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
edgemem = "edgemem.cli:cli"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
