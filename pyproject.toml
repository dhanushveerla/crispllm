[project]
name = "crispllm"
version = "1.1.0"
description = "Lightweight unified memory & context proxy for AI coding on weak hardware"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dhanush Veerla", email = "dhanushveerla@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "llm",
    "memory",
    "proxy",
    "local-llm",
    "ast-slicing",
    "speculative-decoding",
    "mcp",
    "llama-cpp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.165.0",
    "grep-ast>=0.9.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "networkx>=3.6.1",
    "platformdirs>=4.14.7",
    "psutil>=7.2.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.3",
    "tiktoken>=0.14.0",
    "tomli-w>=1.2.0",
    "tree-sitter-language-pack>=1.25.2",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/dhanushveerla/crispllm"
Repository = "https://github.com/dhanushveerla/crispllm"
Documentation = "https://github.com/dhanushveerla/crispllm#readme"
"Bug Tracker" = "https://github.com/dhanushveerla/crispllm/issues"
Changelog = "https://github.com/dhanushveerla/crispllm/blob/master/CHANGELOG.md"

[project.scripts]
crispllm = "crispllm.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crispllm"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
