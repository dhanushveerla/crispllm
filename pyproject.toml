[project]
name = "edgemem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jarvis", email = "jarvis@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "platformdirs>=4.14.7",
    "psutil>=7.2.2",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
edgemem = "edgemem:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
